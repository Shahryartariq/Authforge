name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code. Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.orm }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Authforge ships both ORMs until `pnpm env:setup` picks one. CI checks both.
        orm: [drizzle, prisma]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authforge
          POSTGRES_PASSWORD: authforge
          POSTGRES_DB: authforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://authforge:authforge@localhost:5432/authforge
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      PWNED_PASSWORD_CHECK: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check production dependencies for known vulnerabilities
        run: pnpm audit --prod --audit-level=high
      - name: Switch to Prisma
        if: matrix.orm == 'prisma' && hashFiles('orm/prisma/prisma.config.ts') != ''
        run: pnpm env:setup --orm prisma
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Check the schema matches the auth config
        run: |
          git add -A
          pnpm auth:schema
          git diff --exit-code
      - name: Check the Prisma migrations match the schema
        if: hashFiles('prisma/schema.prisma') != ''
        run: |
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code \
            || { echo "SQL Prisma would generate from an empty database:"; pnpm exec prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script; exit 1; }
      - run: pnpm build
      - name: Smoke test (sign up, sign in, admin)
        run: |
          pnpm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000 && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000 || { echo "Server didn't start:"; cat server.log; exit 1; }
          pnpm exec tsx scripts/smoke.ts || { cat server.log; exit 1; }

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authforge
          POSTGRES_PASSWORD: authforge
          POSTGRES_DB: authforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://authforge:authforge@localhost:5432/authforge
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache the browser download (~150 MB) per Playwright version.
      - name: Get the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
