name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authforge
          POSTGRES_PASSWORD: authforge
          POSTGRES_DB: authforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://authforge:authforge@localhost:5432/authforge
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      PWNED_PASSWORD_CHECK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Check the schema matches the auth config
        run: |
          pnpm auth:schema
          git diff --exit-code src/db/schema.ts
      - run: pnpm build
